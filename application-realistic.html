<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>星途科技 · 校园招聘申请（模拟）</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#25334a;font:15px/1.6 system-ui,sans-serif}header{background:#122d50;color:white;padding:20px max(24px,calc((100vw - 1080px)/2))}header strong{font-size:23px}header span{margin-left:22px;color:#b9cce2}main{max-width:1080px;margin:28px auto;padding:0 20px}.intro{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:0}p{color:#65748a}.pill{background:#e6efff;color:#255ca8;padding:6px 14px;border-radius:20px}.notice{background:#fff5db;border:1px solid #ebd79d;padding:12px 16px;border-radius:8px}.layout{display:grid;grid-template-columns:200px 1fr;gap:24px;margin-top:24px}aside{background:white;border:1px solid #e1e6ed;border-radius:10px;padding:20px;height:fit-content}aside a{display:block;color:#48627c;text-decoration:none;padding:10px 0}section{background:white;border:1px solid #e1e6ed;border-radius:10px;padding:24px;margin-bottom:20px}h2{font-size:18px;margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}label{display:block;font-weight:600}.required{color:#c54642}input,select,textarea{display:block;margin-top:7px;width:100%;padding:10px 12px;border:1px solid #bcc8d8;border-radius:6px;font:inherit;background:white;color:#25334a}input:focus,select:focus,textarea:focus{outline:3px solid #deebff;border-color:#3973ba}.hint{display:block;font-size:12px;color:#718096;margin-top:5px;font-weight:400}.wide{grid-column:1/-1}button{padding:11px 22px;border-radius:6px;border:0;background:#275fa9;color:white;font:inherit;cursor:pointer}button:disabled{background:#ccd3dd;cursor:not-allowed}.footer{display:flex;gap:16px;align-items:center;margin:22px 0}#feedback{color:#48627c}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.intro{display:block}.pill{display:inline-block;margin-top:12px}}
</style>
</head>
<body>
<header><strong>星途科技 · 校园招聘</strong><span>虚构企业 / 本地实验</span></header>
<main>
<div class="intro"><div><h1>软件研发工程师 · 申请资料</h1><p>研发中心 ｜ 校园招聘 ｜ 请核对信息后再完成申请</p></div><span class="pill">当前步骤：完善个人资料</span></div>
<div class="notice">这是模拟页面，不会投递、保存或发送资料。<span class="required">*</span> 为必填项；没有可靠资料的字段请留空。</div>
<div class="layout"><aside><strong>申请资料导航</strong><a href="#basic">01 基本信息</a><a href="#education">02 最高教育经历</a><a href="#extra">03 补充信息</a><a href="#question">04 开放问题</a></aside>
<form id="application-form">
<section id="basic"><h2>01 基本信息</h2><p>请填写应聘者本人的联系方式。</p><div class="grid">
<div><label for="r-email">接收招聘通知的电子邮箱 <span class="required">*</span></label><input id="r-email" type="email" required></div>
<div><label for="r-name">应聘者姓名 <span class="required">*</span></label><input id="r-name" type="text" required></div>
<div><label for="r-phone">本人常用手机号码 <span class="required">*</span></label><input id="r-phone" type="tel" pattern="[0-9]{11}" required><small class="hint">请填写11位手机号码。</small></div>
<div><label for="r-contact">紧急联系人姓名</label><input id="r-contact" type="text"><small class="hint">填写亲友姓名，与应聘者本人不同。</small></div>
</div></section>
<section id="education"><h2>02 最高教育经历</h2><p>仅填写最高学历对应的一段经历。</p><div class="grid">
<div><label for="r-degree">最高学历层次 <span class="required">*</span></label><select id="r-degree" required><option value="">请选择</option><option value="b">本科</option><option value="m">硕士</option><option value="d">博士</option></select></div>
<div><label for="r-school">最高学历对应的就读高校 <span class="required">*</span></label><input id="r-school" type="text" required></div>
<div><label for="r-graduation">毕业年月 <span class="required">*</span></label><input id="r-graduation" type="month" required></div>
<div><label for="r-major">所修读的专业名称 <span class="required">*</span></label><input id="r-major" type="text" required></div>
<div><label for="r-gpa">GPA（4分制）</label><input id="r-gpa" type="number" min="0" max="4" step="0.01"></div>
<div><label for="r-rank">专业成绩排名</label><input id="r-rank" type="text" placeholder="例如：前10%"></div>
</div></section>
<section id="extra"><h2>03 补充信息</h2><div class="grid">
<div><label for="r-city">期望工作城市</label><select id="r-city"><option value="">请选择</option><option>北京</option><option>上海</option><option>深圳</option></select></div>
<div><label for="r-salary">期望税前月薪（元）</label><input id="r-salary" type="number" min="0"></div>
<div><label for="r-language">英语能力等级</label><select id="r-language"><option value="">请选择</option><option>大学英语四级</option><option>大学英语六级</option><option>其他</option></select></div>
<div><label for="r-hometown">籍贯</label><input id="r-hometown" type="text"></div>
</div></section>
<section id="question"><h2>04 开放问题</h2><label for="r-intro">请介绍你的优势及与岗位相关的经历</label><textarea id="r-intro" rows="4" maxlength="500"></textarea><small class="hint">本版 Agent 不生成开放题，保留为空供人工填写。</small></section>
<div class="footer"><button type="button" id="check-button">检查资料格式</button><button type="button" disabled>提交申请（模拟禁用）</button></div><p id="feedback" role="status" aria-live="polite"></p>
</form></div>
</main>
<script>
const form=document.getElementById('application-form');
form.addEventListener('submit',event=>event.preventDefault());
document.getElementById('check-button').addEventListener('click',()=>{document.getElementById('feedback').textContent=form.reportValidity()?'必填资料格式检查通过，仍需人工核对事实；未提交。':'必填项缺失或格式错误；未提交。'});
</script>
</body></html>
